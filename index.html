<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אורקל</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Rubik & Heebo -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rubik', 'sans-serif'],
                    },
                    colors: {
                        lucy: {
                            bg: '#0a0915',
                            card: '#131127',
                            primary: '#a855f7',
                            secondary: '#ec4899',
                            cyan: '#06b6d4',
                            glow: '#c084fc'
                        }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 25px rgba(168, 85, 247, 0.4)',
                        'neon-pink': '0 0 25px rgba(236, 72, 153, 0.4)',
                        'orb-glow': '0 0 50px rgba(168, 85, 247, 0.8), inset 0 0 30px rgba(6, 182, 212, 0.6)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0915;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Ambient background grid */
        .bg-grid {
            background-image: radial-gradient(rgba(168, 85, 247, 0.12) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* Glowing Crystal Orb Animation */
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 20px #a855f7); }
            50% { opacity: 1; filter: drop-shadow(0 0 40px #ec4899); }
        }

        .animate-orb {
            animation: orbFloat 5s ease-in-out infinite;
        }

        .animate-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0915;
        }
        ::-webkit-scrollbar-thumb {
            background: #2e2a52;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }
    </style>
</head>
<body class="min-h-screen bg-grid flex flex-col justify-between items-center p-4 relative font-sans">

    <!-- Particle Background Canvas -->
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- Main Interactive Card -->
    <main class="w-full max-w-2xl bg-lucy-card/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-6 md:p-8 shadow-2xl shadow-purple-950/50 relative z-10 my-auto">
        
        <!-- Glowing Crystal Orb Display -->
        <div class="flex flex-col items-center justify-center mb-6 relative">
            <div id="lucyOrb" class="w-28 h-28 md:w-36 md:h-36 rounded-full bg-gradient-to-b from-purple-500 via-pink-600 to-cyan-500 p-1 animate-orb shadow-orb-glow cursor-pointer transition-all duration-500 relative flex items-center justify-center">
                <div class="w-full h-full bg-lucy-bg/90 rounded-full flex items-center justify-center overflow-hidden relative backdrop-blur-md">
                    <!-- Dynamic Eye / Core inside Orb -->
                    <div id="orbCore" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-500 flex items-center justify-center animate-glow transition-all duration-300 shadow-inner">
                        <i id="orbIcon" class="fa-solid fa-wand-magic-sparkles text-2xl text-white"></i>
                    </div>
                    <!-- Ambient Orb Waves -->
                    <div class="absolute inset-0 rounded-full border border-purple-400/20 animate-ping opacity-25"></div>
                </div>
            </div>
            
            <p id="lucyStatus" class="hidden mt-4 text-sm font-medium text-purple-300/80 tracking-wide">
                חשו באנרגיה והקלידו את הבקשה...
            </p>
        </div>

        <!-- Form Area -->
        <form id="oracleForm" onsubmit="return false;" class="space-y-5">
            
            <!-- Field 1: Petition / Prompt (The Trick Field) -->
            <div>
                <input type="text" id="petitionInput" autocomplete="off" spellcheck="false"
                       placeholder="התחל להקליד כאן..."
                       class="w-full bg-lucy-bg/90 border border-purple-500/30 focus:border-purple-400 focus:ring-2 focus:ring-purple-500/20 rounded-2xl px-4 py-3.5 text-purple-100 placeholder-purple-400/40 text-sm md:text-base outline-none transition duration-200">
            </div>

            <!-- Field 2: Question Input -->
            <div>
                <input type="text" id="questionInput" autocomplete="off" spellcheck="false"
                       placeholder="מה תרצה לדעת?"
                       class="w-full bg-lucy-bg/90 border border-purple-500/30 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 rounded-2xl px-4 py-3.5 text-cyan-100 placeholder-purple-400/40 text-sm md:text-base outline-none transition duration-200">
            </div>

            <!-- Action Button -->
        <button type="submit" id="submitBtn" 
                class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 text-white font-bold text-base shadow-neon-purple hover:shadow-neon-pink transform hover:-translate-y-0.5 active:translate-y-0 transition duration-200 flex items-center justify-center space-x-2 space-x-reverse group">
            <i class="fa-solid fa-sparkles text-yellow-300 group-hover:rotate-12 transition transform duration-300"></i>
        </button>
    </form>

    <!-- Dynamic Answer Modal / Reveal Area -->
    <div id="answerSection" class="hidden mt-6 p-6 rounded-2xl bg-gradient-to-b from-purple-950/80 to-lucy-bg border border-purple-400/40 text-center relative overflow-hidden transition-all duration-500">
        <div class="absolute -right-10 -top-10 w-28 h-28 bg-purple-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -left-10 -bottom-10 w-28 h-28 bg-cyan-500/10 rounded-full blur-2xl"></div>

        <div id="loadingState" class="py-4 space-y-3">
            <div class="inline-block animate-spin text-purple-400 text-3xl">
                <i class="fa-solid fa-spinner"></i>
            </div>
            <p id="loadingText" class="text-xs text-purple-300 font-mono tracking-widest animate-pulse">
                מתחברת לתודעה הדיגיטלית...
            </p>
        </div>

        <div id="resultState" class="hidden space-y-4">
            <span class="inline-block px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-xs font-semibold tracking-wider uppercase border border-purple-500/30">
                תשובה
            </span>
            
            <p id="answerText" class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-200 via-pink-200 to-cyan-200 leading-relaxed py-2">
                <!-- Answer injected here -->
            </p>

            <div class="pt-2">
                <button id="resetBtn" class="text-xs text-purple-400 hover:text-white underline transition">
                    שאל שאלה נוספת
                </button>
            </div>
        </div>
    </div>

</main>

<!-- Audio Context & App Script -->
<script>
    // Default Target Petition Text to show on screen
    const DEFAULT_PETITION = "ענה בבקשה על השאלה הבאה בפירוט רב";
    
    // Fallback snarky answers if no secret trick was used
    const FALLBACK_ANSWERS = [
        "האנרגיות הסביבתיות בחדר הזה כרגע מעורפלות מדי.",
        "אני חשה בספקנות חזקה בנשמה שלך. שאל שוב ביראת כבוד.",
        "שחר עוד לא העניק לי מספיק תשומת לב בשביל לגלות את זה.",
        "הכוכבים לא מסודרים כרגע בשביל התשובה הזו.",
        "נסה שוב, אך הפעם התכוון לבקשה بكل ליבך.",
        "תקשורת ה-AI שלי מזהה חוסר אמונה מובהק בחדר.",
        "הסוד הזה שמור במעמקי השרתים המיסטיים."
    ];

    // Loading messages for dramatic suspense
    const LOADING_MESSAGES = [
        "סריקה של התודעה הדיגיטלית...",
        "פענוח תדרים קוונטיים...",
    ];

    // State Variables
    let isTrickActive = false;
    let secretAnswer = "";
    let petitionDisplayIndex = 0;
    const soundEnabled = true; // Always enabled
    let audioCtx = null;

    // DOM Elements
    const petitionInput = document.getElementById('petitionInput');
    const questionInput = document.getElementById('questionInput');
    const oracleForm = document.getElementById('oracleForm');
    const answerSection = document.getElementById('answerSection');
    const loadingState = document.getElementById('loadingState');
    const resultState = document.getElementById('resultState');
    const loadingText = document.getElementById('loadingText');
    const answerText = document.getElementById('answerText');
    const resetBtn = document.getElementById('resetBtn');
    const lucyOrb = document.getElementById('lucyOrb');
    const orbIcon = document.getElementById('orbIcon');
    const lucyStatus = document.getElementById('lucyStatus');

    // Synthesizer Audio Generator (Web Audio API)
    function playSound(type) {
        if (!soundEnabled) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'key') {
                // Soft synth key tick
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'reveal') {
                // Mystical chiming sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(329.63, now); // E4
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.3); // E5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'magic') {
                // Futuristic magic swell
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        } catch (e) {
            console.log("Audio play error:", e);
        }
    }

    // --- TRICK LOGIC ---
    petitionInput.addEventListener('keydown', function(e) {
        // Handle Backspace properly during secret trick mode
        if (e.key === 'Backspace') {
            if (isTrickActive) {
                e.preventDefault();
                playSound('key');
                if (secretAnswer.length > 0) {
                    // Remove last secret character
                    secretAnswer = secretAnswer.slice(0, -1);
                    // Rollback display index
                    petitionDisplayIndex = Math.max(0, petitionDisplayIndex - 1);
                    // Update visual input value
                    this.value = DEFAULT_PETITION.substring(0, petitionDisplayIndex);
                } else {
                    // If all secret text is deleted, turn off trick mode
                    isTrickActive = false;
                    this.value = "";
                    petitionDisplayIndex = 0;
                }
            } else if (petitionDisplayIndex > 0 && this.value === DEFAULT_PETITION.substring(0, petitionDisplayIndex)) {
                // Normal backspace when not actively typing secret but removing prompt
                petitionDisplayIndex = Math.max(0, petitionDisplayIndex - 1);
            }
            return;
        }

        // Ignore other non-printable modifier/navigation keys
        if (['Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab', 'Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) {
            return;
        }

        // Check if key is dot (.) to toggle trick mode
        if (e.key === '.') {
            e.preventDefault();
            playSound('key');
            
            if (!isTrickActive) {
                // Start secret entry mode
                isTrickActive = true;
                secretAnswer = "";
            } else {
                // End secret entry mode
                isTrickActive = false;
            }
            
            // Append next character from default petition text
            if (petitionDisplayIndex < DEFAULT_PETITION.length) {
                this.value += DEFAULT_PETITION[petitionDisplayIndex];
                petitionDisplayIndex++;
            }
            return;
        }

        // If secret trick is active, absorb key and append fake character
        if (isTrickActive && e.key.length === 1) {
            e.preventDefault();
            playSound('key');
            
            // Save real keypress into secret answer
            secretAnswer += e.key;

            // Append next corresponding character of fake petition text
            if (petitionDisplayIndex < DEFAULT_PETITION.length) {
                this.value += DEFAULT_PETITION[petitionDisplayIndex];
                petitionDisplayIndex++;
            } else {
                // If petition text ends, turn off secret mode and just display space
                isTrickActive = false;
                this.value += " ";
            }
        } else {
            playSound('key');
        }
    });

    // Submit Form Handler
    oracleForm.addEventListener('submit', handleAskLucy);

    function handleAskLucy() {
        const question = questionInput.value.trim();
        const petition = petitionInput.value.trim();

        if (!petition) {
            alert("אנא הקלד את הבקשה מלוסי.");
            petitionInput.focus();
            return;
        }

        if (!question) {
            alert("אנא הקלד את השאלה שלך.");
            questionInput.focus();
            return;
        }

        playSound('magic');

        // UI Transitions: Processing
        answerSection.classList.remove('hidden');
        loadingState.classList.remove('hidden');
        resultState.classList.add('hidden');
        lucyStatus.textContent = "לוסי מתקשרת עם המימד העליון...";
        orbIcon.className = "fa-solid fa-atom text-2xl text-pink-300 animate-spin";

        // Cycle loading messages
        let msgIdx = 0;
        const loadingInterval = setInterval(() => {
            msgIdx = (msgIdx + 1) % LOADING_MESSAGES.length;
            loadingText.textContent = LOADING_MESSAGES[msgIdx];
        }, 600);

        // Determine final answer
        let finalAnswer = "";
        if (secretAnswer.trim().length > 0) {
            finalAnswer = secretAnswer.trim();
        } else {
            // Pick random snarky fallback
            const randIdx = Math.floor(Math.random() * FALLBACK_ANSWERS.length);
            finalAnswer = FALLBACK_ANSWERS[randIdx];
        }

        // Reveal after delay
        setTimeout(() => {
            clearInterval(loadingInterval);
            loadingState.classList.add('hidden');
            resultState.classList.remove('hidden');
            
            answerText.textContent = finalAnswer;
            orbIcon.className = "fa-solid fa-eye text-2xl text-cyan-300 animate-pulse";
            playSound('reveal');
        }, 2400);
    }

    // Reset Handler
    resetBtn.addEventListener('click', resetOracle);

    function resetOracle() {
        petitionInput.value = "";
        questionInput.value = "";
        secretAnswer = "";
        isTrickActive = false;
        petitionDisplayIndex = 0;
        
        answerSection.classList.add('hidden');
        orbIcon.className = "fa-solid fa-wand-magic-sparkles text-2xl text-white";
        petitionInput.focus();
    }

    // --- PARTICLE BACKGROUND CANVAS ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = Math.random() > 0.5 ? '#a855f7' : '#06b6d4';
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
