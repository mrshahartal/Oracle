<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אורקל</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Rubik -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Rubik', 'sans-serif'] },
                    colors: {
                        lucy: { bg: '#0a0915', card: '#131127', primary: '#a855f7', secondary: '#ec4899', cyan: '#06b6d4' }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 25px rgba(168, 85, 247, 0.4)',
                        'neon-pink': '0 0 25px rgba(236, 72, 153, 0.4)',
                        'orb-glow': '0 0 50px rgba(168, 85, 247, 0.8), inset 0 0 30px rgba(6, 182, 212, 0.6)'
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0a0915; color: #f3f4f6; overflow-x: hidden; }
        .bg-grid { background-image: radial-gradient(rgba(168, 85, 247, 0.12) 1px, transparent 0); background-size: 30px 30px; }
        @keyframes orbFloat { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-12px) scale(1.03); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 20px #a855f7); } 50% { opacity: 1; filter: drop-shadow(0 0 40px #ec4899); } }
        .animate-orb { animation: orbFloat 5s ease-in-out infinite; }
        .animate-glow { animation: pulseGlow 3s ease-in-out infinite; }
        
        @keyframes progressFill {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: progressFill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0915; }
        ::-webkit-scrollbar-thumb { background: #2e2a52; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
    </style>
</head>
<body class="min-h-screen bg-grid flex flex-col justify-between items-center p-4 relative font-sans">

    <!-- Particle Background Canvas -->
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <!-- Main Interactive Card -->
    <main class="w-full max-w-2xl bg-lucy-card/80 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-6 md:p-8 shadow-2xl shadow-purple-950/50 relative z-10 my-auto">
        
        <!-- Glowing Crystal Orb Display -->
        <div class="flex flex-col items-center justify-center mb-6 relative">
            <div id="lucyOrb" class="w-28 h-28 md:w-36 md:h-36 rounded-full bg-gradient-to-b from-purple-500 via-pink-600 to-cyan-500 p-1 animate-orb shadow-orb-glow relative flex items-center justify-center">
                <div class="w-full h-full bg-lucy-bg/90 rounded-full flex items-center justify-center overflow-hidden relative backdrop-blur-md">
                    <div id="orbCore" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-500 flex items-center justify-center animate-glow shadow-inner">
                        <i id="orbIcon" class="fa-solid fa-wand-magic-sparkles text-2xl text-white"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form Area -->
        <form id="oracleForm" onsubmit="return false;" class="space-y-5">
            <div>
                <input type="text" id="petitionInput" autocomplete="off" spellcheck="false"
                       placeholder="התחל להקליד כאן..."
                       class="w-full bg-lucy-bg/90 border border-purple-500/30 focus:border-purple-400 rounded-2xl px-4 py-3.5 text-purple-100 placeholder-purple-400/40 text-sm md:text-base outline-none transition">
            </div>

            <div>
                <input type="text" id="questionInput" autocomplete="off" spellcheck="false"
                       placeholder="מה תרצה לדעת?"
                       class="w-full bg-lucy-bg/90 border border-purple-500/30 focus:border-cyan-400 rounded-2xl px-4 py-3.5 text-cyan-100 placeholder-purple-400/40 text-sm md:text-base outline-none transition">
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-cyan-600 text-white font-bold text-base shadow-neon-purple hover:shadow-neon-pink transform hover:-translate-y-0.5 transition flex items-center justify-center">
                <i class="fa-solid fa-sparkles text-yellow-300"></i>
            </button>
        </form>

        <!-- Dynamic Answer Modal -->
        <div id="answerSection" class="hidden mt-6 p-6 rounded-2xl bg-gradient-to-b from-purple-950/80 to-lucy-bg border border-purple-400/40 text-center relative overflow-hidden">
            
            <!-- Loading & Progress Bar State -->
            <div id="loadingState" class="space-y-3 py-2">
                <p class="text-xs text-purple-300 font-mono tracking-widest animate-pulse">
                    מתחברת לתודעה הדיגיטלית...
                </p>
                <!-- Sexy Neon Progress Bar -->
                <div class="w-full bg-lucy-bg rounded-full h-2.5 p-0.5 border border-purple-500/30 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-purple-500 via-pink-500 to-cyan-400 h-full rounded-full w-0 shadow-neon-purple"></div>
                </div>
            </div>

            <!-- Result State -->
            <div id="resultState" class="hidden space-y-4">
                <span class="inline-block px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-xs font-semibold uppercase border border-purple-500/30">
                    תשובה
                </span>
                <p id="answerText" class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-200 via-pink-200 to-cyan-200 leading-relaxed py-2"></p>
                <div class="pt-2">
                    <button id="resetBtn" class="text-xs text-purple-400 hover:text-white underline transition">
                        שאל שאלה נוספת
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- App Script -->
    <script>
        const DEFAULT_PETITION = "ענה בבקשה על השאלה הבאה בפירוט רב";
        let isTrickActive = false;
        let secretAnswer = "";
        let petitionDisplayIndex = 0;

        const petitionInput = document.getElementById('petitionInput');
        const questionInput = document.getElementById('questionInput');
        const oracleForm = document.getElementById('oracleForm');
        const answerSection = document.getElementById('answerSection');
        const loadingState = document.getElementById('loadingState');
        const resultState = document.getElementById('resultState');
        const progressBar = document.getElementById('progressBar');
        const answerText = document.getElementById('answerText');
        const resetBtn = document.getElementById('resetBtn');
        const orbIcon = document.getElementById('orbIcon');

        petitionInput.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                e.preventDefault();
                if (isTrickActive && secretAnswer.length > 0) {
                    secretAnswer = secretAnswer.slice(0, -1);
                    petitionDisplayIndex = Math.max(0, petitionDisplayIndex - 1);
                    this.value = DEFAULT_PETITION.substring(0, petitionDisplayIndex);
                } else {
                    isTrickActive = false;
                    this.value = "";
                    secretAnswer = "";
                    petitionDisplayIndex = 0;
                }
                return;
            }

            if (e.key === '.') {
                e.preventDefault();
                isTrickActive = !isTrickActive;
                if (petitionDisplayIndex < DEFAULT_PETITION.length) {
                    this.value += DEFAULT_PETITION[petitionDisplayIndex];
                    petitionDisplayIndex++;
                }
                return;
            }

            if (isTrickActive && e.key.length === 1) {
                e.preventDefault();
                secretAnswer += e.key;
                if (petitionDisplayIndex < DEFAULT_PETITION.length) {
                    this.value += DEFAULT_PETITION[petitionDisplayIndex];
                    petitionDisplayIndex++;
                }
            }
        });

        oracleForm.addEventListener('submit', () => {
            if (!petitionInput.value.trim() || !questionInput.value.trim()) {
                alert("אנא מלא את כל השדות.");
                return;
            }

            // Show loading & trigger progress bar animation
            answerSection.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            resultState.classList.add('hidden');
            progressBar.classList.remove('animate-progress');
            void progressBar.offsetWidth; // Force reflow
            progressBar.classList.add('animate-progress');
            
            orbIcon.className = "fa-solid fa-atom text-2xl text-pink-300 animate-spin";

            // Reveal after 2 seconds
            setTimeout(() => {
                loadingState.classList.add('hidden');
                resultState.classList.remove('hidden');
                answerText.textContent = secretAnswer.trim() || "אנרגיות החדר מעורפלות כרגע...";
                orbIcon.className = "fa-solid fa-eye text-2xl text-cyan-300 animate-pulse";
            }, 2000);
        });

        resetBtn.addEventListener('click', () => {
            petitionInput.value = "";
            questionInput.value = "";
            secretAnswer = "";
            isTrickActive = false;
            petitionDisplayIndex = 0;
            answerSection.classList.add('hidden');
            progressBar.classList.remove('animate-progress');
            orbIcon.className = "fa-solid fa-wand-magic-sparkles text-2xl text-white";
            petitionInput.focus();
        });

        // Particle Background
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = Math.random() > 0.5 ? '#a855f7' : '#06b6d4';
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
